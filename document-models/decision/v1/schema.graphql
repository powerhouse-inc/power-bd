type DecisionState {
  question: String
  context: String
  owner: EthereumAddress
  decideBy: Date
  status: DecisionStatus!
  answer: String
  answeredBy: EthereumAddress
  answeredAt: DateTime
  reason: String
  references: [Reference!]!
}

enum DecisionStatus {
  OPEN
  ANSWERED
  WITHDRAWN
}

enum ReferenceKind {
  RESEARCH
  NOTE
  SOURCE
  COMPARABLE
  OPPORTUNITY
  LEAD
  DECISION
  OTHER
}

type Reference {
  id: OID!
  kind: ReferenceKind!
  documentId: PHID!
  title: String!
}

# details

input SetQuestionInput {
  question: String!
  context: String
}

input SetDecisionOwnerInput {
  owner: EthereumAddress
}

input SetDecideByInput {
  decideBy: Date
}

# status

input AnswerDecisionInput {
  answer: String!
  answeredBy: EthereumAddress!
  answeredAt: DateTime!
}

input ReopenDecisionInput {
  reason: String
}

input WithdrawDecisionInput {
  reason: String
}

# references

input AddReferenceInput {
  id: OID!
  kind: ReferenceKind!
  documentId: PHID!
  title: String!
}

input RemoveReferenceInput {
  id: OID!
}
