# limits

input SetAttemptLimitInput {
  max: Int!
  withdrawnCounts: Boolean!
  source: String
  checkedAt: DateTime
}

input ClearAttemptLimitInput {
  _empty: Boolean
}

input SetApplyingEntityInput {
  entity: SetApplyingEntityEntityInput
}

input SetApplyingEntityEntityInput {
  id: PHID!
  title: String!
}

# submissions

input MarkSubmissionInput {
  id: OID!
  stepId: OID
  submittedAt: DateTime!
  where: String
  submittedBy: EthereumAddress!
}

input RecordSubmissionOutcomeInput {
  id: OID!
