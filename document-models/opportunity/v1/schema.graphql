}

input UpdateConditionInput {
  id: OID!
  kind: ConditionKind
  text: String
  decisionIds: [PHID!]
  factNotes: [UpdateConditionFactNoteInput!]
  source: String
  checkedAt: DateTime
}

input UpdateConditionFactNoteInput {
  id: PHID!
  title: String!
}

input RemoveConditionInput {
  id: OID!
}

input MarkConditionInput {
  id: OID!
  state: ConditionState!
  checkedAt: DateTime!
